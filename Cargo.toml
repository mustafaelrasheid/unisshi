[package]
name = "unisshi"
description = "A personal diary and logging cli app."
version = "1.1.2"
edition = "2024"
homepage = "https://github.com/mustafaelrasheid/unisshi"
repository = "https://github.com/mustafaelrasheid/unisshi"
license = "MIT"
keywords = ["diary", "journal", "checklist", "markdown"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = [ "derive" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
